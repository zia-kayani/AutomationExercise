name: UI Tests in CICD environment

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ENV: staging
  BASE_URL: ${{ secrets.BASE_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}

jobs:
  smoke-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Install Playwright browsers 
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Run Smoke Tests
        run: pytest tests/ui -m smoke -v


  regression-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Install Allure CLI
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # Install Playwright browsers (CRITICAL)
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      # Run regression tests
      - name: Run UI Regression Tests
        run: pytest tests/ui -m regression --alluredir=reports/allure/ui/ui-results

      # Generate Allure Report
      - name: Generate Allure Report
        run: |
          allure generate reports/allure/ui/ui-results -o reports/allure/ui/ui-report --clean

      # Upload artifact (FIXED PATH)
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-report
          path: reports/allure/ui/ui-report

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: reports/allure/ui/ui-report
          destination_dir: ui
