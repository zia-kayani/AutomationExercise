name: UI Tests in CICD environment

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ENV: staging
  BASE_URL: ${{ secrets.BASE_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  HEADLESS: true

jobs:
  smoke-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Faster Python setup with pip cache
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'

      #  Install dependencies (cached)
      - name: Install dependencies
        run: pip install -r requirements.txt

      #  Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      # Install Playwright browsers (instant if cached)
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Run Smoke Tests
        run: pytest tests/ui -m smoke -v


  regression-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Faster Python setup with pip cache
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      # Cache Allure
      - name: Cache Allure
        uses: actions/cache@v4
        with:
          path: /opt/allure
          key: ${{ runner.os }}-allure-2.24.0

      # # Install Allure only if not cached
      # - name: Install Allure
      #   run: |
      #     if [ ! -d "/opt/allure" ]; then
      #       sudo apt-get update
      #       sudo apt-get install -y openjdk-11-jre
      #       wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
      #       tar -zxvf allure-2.24.0.tgz
      #       sudo mv allure-2.24.0 /opt/allure
      #       sudo ln -s /opt/allure/bin/allure /usr/bin/allure
      #     fi
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/latest/download/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      # Run regression tests
      - name: Run UI Regression Tests
        run: pytest tests/ui -m regression --alluredir=reports/allure/ui/ui-results || true

      # Generate Allure Report
      - name: Generate Allure Report
        run: |
          allure generate reports/allure/ui/ui-results -o reports/allure/ui/ui-report --clean

      # Upload artifact
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-report
          path: reports/allure/ui/ui-report

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: reports/allure/ui/ui-report
          destination_dir: ui
